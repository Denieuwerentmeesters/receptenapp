# Vertaalt recepten naar het Engels (titel_en, ingredienten_en, bereiding_en).
# Alleen met de hand: gh workflow run vertalen.yml -f aantal=1000
# Kijken of het lukte: gh run list --workflow vertalen.yml
# Vergt de secrets DATABASE_URL en ANTHROPIC_API_KEY. Mislukte recepten blijven
# onvertaald; start de workflow gewoon nog eens.
name: Recepten vertalen

on:
  workflow_dispatch:
    inputs:
      aantal:
        description: 'Hoeveel recepten (5 voor een steekproef, 1000 voor de hele pool)'
        default: '5'
        required: true

jobs:
  vertalen:
    name: Recepten vertalen
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies installeren
        run: npm ci

      - name: Vertalen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AANTAL: ${{ inputs.aantal }}
        run: npm run vertaal -- --limit "$AANTAL"
