# Vult bonus_actie en recept_bonus, elke nacht. PrijsProfeet ververst rond
# 23:00 UTC; een prijs mag niet langer dan 24 uur als actueel getoond worden.
# Tussendoor met de hand: gh workflow run bonus.yml
# Kijken of het lukte: gh run list --workflow bonus.yml
name: Bonus ophalen

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ophalen:
    name: Bonus ophalen
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies installeren
        run: npm ci

      - name: Ophalen en koppelen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRIJSPROFEET_API_KEY: ${{ secrets.PRIJSPROFEET_API_KEY }}
        run: npm run bonus-ophalen
